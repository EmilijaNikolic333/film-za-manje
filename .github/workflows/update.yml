name: Osveži repertoar

on:
  schedule:
    # svakog četvrtka u 04:00 UTC (5–6h po beogradskom vremenu), kad kreće nova bioskopska nedelja
    - cron: "0 4 * * 4"
  workflow_dispatch: # ručno pokretanje iz kartice Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/update.mjs
      - name: Commit ako ima promena
        run: |
          if git diff --quiet -- data.js; then echo "Nema promena."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "Repertoar: osvežen $(date -u +%Y-%m-%d)"
          git push
